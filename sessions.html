<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Séances de yoga - Yoga App"
      data-i18n-attr-content="sessions.metaDescription"
    />
    <title data-i18n="sessions.pageTitle">Séances - Yoga App</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/sessions.css" />
    <link rel="icon" href="favicon-48x481.png" type="image/x-icon" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="dashboard-navbar">
      <div class="navbar-container">
        <a href="index.html" class="navbar-logo">
          <span class="logo-icon">🧘</span>
          <span class="logo-text">Yoga App</span>
        </a>
        <div class="navbar-menu">
          <a
            href="sessions.html"
            class="navbar-link active"
            data-i18n="common.nav.sessions"
            >Séances</a
          >
          <a
            href="respirer.html"
            class="navbar-link"
            data-i18n="common.nav.breathing"
            >Respiration</a
          >
          <a
            href="progress.html"
            class="navbar-link"
            data-i18n="common.nav.progress"
            >Progression</a
          >
          <a
            href="learning.html"
            class="navbar-link"
            data-i18n="common.nav.learning"
            >Apprentissage</a
          >
        </div>
        <div class="navbar-actions">
          <button
            id="language-toggle"
            class="language-toggle"
            data-i18n-aria-label="common.aria.language"
            aria-label="Changer de langue"
          >
            <svg
              class="flag-icon"
              data-lang="fr"
              width="32"
              height="24"
              viewBox="0 0 32 24"
              aria-hidden="true"
            >
              <rect width="10.67" height="24" fill="#002395" />
              <rect x="10.67" width="10.67" height="24" fill="#FFFFFF" />
              <rect x="21.33" width="10.67" height="24" fill="#ED2939" />
            </svg>
          </button>
          <button
            id="theme-toggle"
            class="theme-toggle-nav"
            data-i18n-aria-label="common.aria.theme"
            aria-label="Changer le thème"
          >
            <svg
              class="sun-icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg
              class="moon-icon hidden"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button
            id="logout-btn"
            class="btn-logout hidden"
            data-i18n-aria-label="common.aria.logout"
            aria-label="Déconnexion"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
          <a
            href="dashboard.html"
            class="btn-profile"
            data-i18n-aria-label="common.aria.profile"
            aria-label="Mon profil"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </a>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="sessions-hero">
      <div class="container">
        <h1 class="hero-title" data-i18n="sessions.hero.title">
          Trouvez votre séance idéale
        </h1>
        <p class="hero-subtitle" data-i18n="sessions.hero.subtitle">
          Filtrez par niveau, durée ou objectif
        </p>
      </div>
    </section>

    <!-- Filters Bar (Sticky) -->
    <div class="filters-container">
      <div class="container">
        <div class="filters-bar">
          <!-- Search Box -->
          <div class="filter-group search-group">
            <svg
              class="search-icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Rechercher une séance..."
              data-i18n-placeholder="sessions.search.placeholder"
            />
          </div>

          <!-- Level Filter -->
          <div class="filter-group">
            <select id="level-filter" class="filter-select">
              <option value="" data-i18n="sessions.filter.level.all">
                Tous les niveaux
              </option>
              <option
                value="beginner"
                data-i18n="sessions.filter.level.beginner"
              >
                Débutant
              </option>
              <option
                value="intermediate"
                data-i18n="sessions.filter.level.intermediate"
              >
                Intermédiaire
              </option>
              <option
                value="advanced"
                data-i18n="sessions.filter.level.advanced"
              >
                Avancé
              </option>
            </select>
          </div>

          <!-- Duration Filter -->
          <div class="filter-group">
            <select id="duration-filter" class="filter-select">
              <option value="" data-i18n="sessions.filter.duration.all">
                Toutes les durées
              </option>
              <option value="5-10">5-10 min</option>
              <option value="10-20">10-20 min</option>
              <option value="20-45">20-45 min</option>
              <option value="45+">45+ min</option>
            </select>
          </div>

          <!-- Type Filter -->
          <div class="filter-group">
            <select id="type-filter" class="filter-select">
              <option value="" data-i18n="sessions.filter.type.all">
                Tous les types
              </option>
              <option value="hatha">Hatha</option>
              <option value="vinyasa">Vinyasa</option>
              <option value="yin">Yin</option>
              <option value="flow">Flow</option>
            </select>
          </div>

          <!-- Goal Filter -->
          <div class="filter-group">
            <select id="goal-filter" class="filter-select">
              <option value="" data-i18n="sessions.filter.goal.all">
                Tous les objectifs
              </option>
              <option
                value="détente"
                data-i18n="sessions.filter.goal.relaxation"
              >
                Détente
              </option>
              <option
                value="mobilité"
                data-i18n="sessions.filter.goal.mobility"
              >
                Mobilité
              </option>
              <option
                value="renforcement"
                data-i18n="sessions.filter.goal.strength"
              >
                Renforcement
              </option>
              <option value="énergie" data-i18n="sessions.filter.goal.energy">
                Énergie
              </option>
            </select>
          </div>
        </div>

        <!-- Results Count -->
        <div class="results-info">
          <p id="results-count" class="results-count">
            <span data-i18n="sessions.results.loading"
              >Chargement des séances...</span
            >
          </p>
        </div>
      </div>
    </div>

    <!-- Sessions Grid -->
    <section class="sessions-section">
      <div class="container">
        <div id="sessions-grid" class="sessions-grid">
          <!-- Sessions will be loaded here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon">🔍</div>
          <h3 class="empty-title" data-i18n="sessions.empty.title">
            Aucune séance trouvée
          </h3>
          <p class="empty-text" data-i18n="sessions.empty.text">
            Essayez d'ajuster vos filtres pour trouver d'autres séances
          </p>
          <button
            id="reset-filters"
            class="btn btn-primary"
            data-i18n="sessions.empty.reset"
          >
            Réinitialiser les filtres
          </button>
        </div>
      </div>
    </section>

    <!-- Scripts -->
    <script defer src="js/i18n-manager.js"></script>
    <script defer src="js/footer-loader.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/sessions.js"></script>
  </body>
</html>
