<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="auth.registerPage.title">Inscription - Yoga App</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <!-- PREMIUM 2026 DESIGN SYSTEM -->
    <link rel="stylesheet" href="css/premium-design-system.css" />
    <link rel="stylesheet" href="css/animations-premium.css" />
    <link rel="stylesheet" href="css/layout-premium.css" />
    <link rel="stylesheet" href="css/mobile-premium.css" />
    <link rel="icon" href="favicon-48x481.png" type="image/x-icon" />
  </head>
  <body class="auth-page">
    <!-- Language Toggle Button -->
    <button
      id="language-toggle"
      class="language-toggle"
      data-i18n-aria-label="common.aria.language"
      aria-label="Changer de langue"
    >
      <svg
        class="flag-icon"
        data-lang="fr"
        width="32"
        height="24"
        viewBox="0 0 32 24"
        aria-hidden="true"
      >
        <rect width="10.67" height="24" fill="#002395" />
        <rect x="10.67" width="10.67" height="24" fill="#FFFFFF" />
        <rect x="21.33" width="10.67" height="24" fill="#ED2939" />
      </svg>
    </button>

    <!-- Theme Toggle Button -->
    <button
      id="theme-toggle"
      class="theme-toggle"
      data-i18n-aria-label="common.aria.theme"
      aria-label="Changer le thème"
    >
      <svg
        class="sun-icon"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg
        class="moon-icon hidden"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="auth-container">
      <div class="auth-card">
        <!-- Back Button -->
        <a href="index.html" class="back-link">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span data-i18n="common.back">Retour</span>
        </a>

        <!-- Logo / Title -->
        <div class="auth-header">
          <h1 data-i18n="auth.registerPage.header.title">Créer un compte</h1>
          <p data-i18n="auth.registerPage.header.subtitle">
            Commencez votre voyage vers le bien-être
          </p>
        </div>

        <!-- Register Form -->
        <form id="register-form" class="auth-form">
          <div class="form-group">
            <label for="name" data-i18n="auth.fields.firstName"
              >Prénom / Nom</label
            >
            <input
              type="text"
              id="name"
              name="name"
              required
              autocomplete="given-name"
              placeholder="Marie"
              data-i18n-placeholder="auth.placeholders.firstName"
              minlength="2"
              maxlength="50"
            />
          </div>

          <div class="form-group">
            <label for="email" data-i18n="auth.fields.email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              placeholder="votre@email.com"
              data-i18n-placeholder="auth.placeholders.email"
            />
          </div>

          <div class="form-group">
            <label for="password" data-i18n="auth.fields.password"
              >Mot de passe</label
            >
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="new-password"
              placeholder="••••••••"
              data-i18n-placeholder="auth.placeholders.password"
              minlength="8"
            />
            <small class="form-hint" data-i18n="auth.registerPage.passwordHint"
              >Minimum 8 caractères, incluant majuscule et chiffre</small
            >
          </div>

          <div class="form-group">
            <label
              for="confirm-password"
              data-i18n="auth.registerPage.confirmPassword"
            >
              Confirmer le mot de passe
            </label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              required
              autocomplete="new-password"
              placeholder="••••••••"
              data-i18n-placeholder="auth.placeholders.password"
            />
          </div>

          <div class="form-group">
            <label for="level" data-i18n="auth.registerPage.levelLabel">
              Votre niveau
            </label>
            <select id="level" name="level" required>
              <option value="" data-i18n="auth.registerPage.level.placeholder">
                Choisissez votre niveau
              </option>
              <option
                value="beginner"
                data-i18n="auth.registerPage.level.beginner"
              >
                Débutant - Je découvre le yoga
              </option>
              <option
                value="intermediate"
                data-i18n="auth.registerPage.level.intermediate"
              >
                Intermédiaire - Je pratique régulièrement
              </option>
              <option
                value="advanced"
                data-i18n="auth.registerPage.level.advanced"
              >
                Avancé - Je pratique depuis longtemps
              </option>
            </select>
          </div>

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" id="terms" name="terms" required />
              <span>
                <span data-i18n="auth.registerPage.acceptPrefix"
                  >J'accepte les</span
                >
                <a href="#" class="link" data-i18n="auth.registerPage.terms"
                  >conditions d'utilisation</a
                >
              </span>
            </label>
          </div>

          <!-- Error Message -->
          <div id="error-message" class="error-message hidden"></div>

          <!-- Success Message -->
          <div id="success-message" class="success-message hidden"></div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="btn btn-primary btn-block"
            id="submit-btn"
            data-i18n="auth.registerPage.submit"
          >
            Créer mon compte
          </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <span data-i18n="auth.divider">ou</span>
        </div>

        <!-- Login Link -->
        <p class="auth-footer">
          <span data-i18n="auth.registerPage.hasAccount">Déjà un compte ?</span>
          <a href="login.html" class="link" data-i18n="auth.login"
            >Se connecter</a
          >
        </p>
      </div>

      <!-- Decorative Quote -->
      <div class="auth-quote">
        <blockquote>
          <span data-i18n="auth.registerPage.quote">
            "Vous ne pouvez pas arrêter les vagues, mais vous pouvez apprendre à
            surfer."
          </span>
        </blockquote>
      </div>
    </div>

    <!-- Footer will be loaded dynamically -->
    <!-- <script src="js/footer-loader.js"></script> -->
    <script src="js/i18n-manager.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script>
      // Handle register form submission
      document
        .getElementById("register-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const submitBtn = document.getElementById("submit-btn");
          const errorMessage = document.getElementById("error-message");
          const successMessage = document.getElementById("success-message");

          // Get form data
          const name = document.getElementById("name").value.trim();
          const email = document
            .getElementById("email")
            .value.trim()
            .toLowerCase();
          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirm-password").value;
          const level = document.getElementById("level").value;
          const termsAccepted = document.getElementById("terms").checked;

          const t = (key, fallback) => {
            if (window.i18n && typeof i18n.getTranslation === "function") {
              return i18n.getTranslation(key) || fallback;
            }
            return fallback;
          };

          // Loading state
          submitBtn.disabled = true;
          submitBtn.textContent = t("auth.registerPage.loading", "Création...");
          errorMessage.classList.add("hidden");
          successMessage.classList.add("hidden");
          errorMessage.textContent = "";
          successMessage.textContent = "";

          // Validate required choices
          if (!level) {
            errorMessage.textContent = t(
              "auth.registerPage.levelRequired",
              "Choisissez votre niveau",
            );
            errorMessage.classList.remove("hidden");
            submitBtn.disabled = false;
            submitBtn.textContent = t(
              "auth.registerPage.submit",
              "Créer mon compte",
            );
            return;
          }

          if (!termsAccepted) {
            errorMessage.textContent = t(
              "auth.registerPage.termsRequired",
              "Vous devez accepter les conditions d'utilisation",
            );
            errorMessage.classList.remove("hidden");
            submitBtn.disabled = false;
            submitBtn.textContent = t(
              "auth.registerPage.submit",
              "Créer mon compte",
            );
            return;
          }

          // Validate passwords match
          if (password !== confirmPassword) {
            errorMessage.textContent = t(
              "auth.registerPage.passwordMismatch",
              "Les mots de passe ne correspondent pas",
            );
            errorMessage.classList.remove("hidden");
            submitBtn.disabled = false;
            submitBtn.textContent = t(
              "auth.registerPage.submit",
              "Créer mon compte",
            );
            return;
          }

          try {
            await register(email, password, name, level);

            // Success
            successMessage.textContent = t(
              "auth.registerPage.success",
              "Compte créé avec succès ! Redirection...",
            );
            successMessage.classList.remove("hidden");

            // Redirect after 1 second
            setTimeout(() => {
              window.location.href = "dashboard.html";
            }, 1000);
          } catch (error) {
            // Show error
            errorMessage.textContent = error.message;
            errorMessage.classList.remove("hidden");

            // Reset button
            submitBtn.disabled = false;
            submitBtn.textContent = t(
              "auth.registerPage.submit",
              "Créer mon compte",
            );
          }
        });

      // Real-time password validation
      document.getElementById("password").addEventListener("input", (e) => {
        const password = e.target.value;
        const hint = e.target.nextElementSibling;

        const t = (key, fallback) => {
          if (window.i18n && typeof i18n.getTranslation === "function") {
            return i18n.getTranslation(key) || fallback;
          }
          return fallback;
        };

        if (
          password.length >= 8 &&
          /[A-Z]/.test(password) &&
          /[0-9]/.test(password)
        ) {
          hint.style.color = "var(--success)";
          hint.textContent = t(
            "auth.registerPage.passwordStrong",
            "✓ Mot de passe fort",
          );
        } else {
          hint.style.color = "var(--text-secondary)";
          hint.textContent = t(
            "auth.registerPage.passwordHint",
            "Minimum 8 caractères, incluant majuscule et chiffre",
          );
        }
      });
    </script>
    <!-- PREMIUM ANIMATIONS & SCROLL SYSTEM -->
    <script defer src="js/premium-animations.js"></script>
    <script defer src="js/scroll-animations.js"></script>
  </body>
</html>
