<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="auth.loginPage.title">Connexion - Yoga App</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/themes.css" />
  </head>
  <body class="auth-page">
    <!-- Language Toggle Button -->
    <button
      id="language-toggle"
      class="language-toggle"
      data-i18n-aria-label="common.aria.language"
      aria-label="Changer de langue"
    >
      <svg
        class="flag-icon"
        data-lang="fr"
        width="32"
        height="24"
        viewBox="0 0 32 24"
        aria-hidden="true"
      >
        <rect width="10.67" height="24" fill="#002395" />
        <rect x="10.67" width="10.67" height="24" fill="#FFFFFF" />
        <rect x="21.33" width="10.67" height="24" fill="#ED2939" />
      </svg>
    </button>

    <!-- Theme Toggle Button -->
    <button
      id="theme-toggle"
      class="theme-toggle"
      data-i18n-aria-label="common.aria.theme"
      aria-label="Changer le thème"
    >
      <svg
        class="sun-icon"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg
        class="moon-icon hidden"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="auth-container">
      <div class="auth-card">
        <!-- Back Button -->
        <a href="index.html" class="back-link">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span data-i18n="common.back">Retour</span>
        </a>

        <!-- Logo / Title -->
        <div class="auth-header">
          <h1 data-i18n="auth.loginPage.header.title">Bienvenue</h1>
          <p data-i18n="auth.loginPage.header.subtitle">
            Connectez-vous pour continuer votre pratique
          </p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label for="email" data-i18n="auth.fields.email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              placeholder="votre@email.com"
              data-i18n-placeholder="auth.placeholders.email"
            />
          </div>

          <div class="form-group">
            <label for="password" data-i18n="auth.fields.password">
              Mot de passe
            </label>
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="••••••••"
              data-i18n-placeholder="auth.placeholders.password"
            />
          </div>

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" id="remember" name="remember" />
              <span data-i18n="auth.loginPage.remember"
                >Se souvenir de moi</span
              >
            </label>
            <a href="#" class="link" data-i18n="auth.loginPage.forgot">
              Mot de passe oublié ?
            </a>
          </div>

          <!-- Error Message -->
          <div id="error-message" class="error-message hidden"></div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="btn btn-primary btn-block"
            id="submit-btn"
            data-i18n="auth.login"
          >
            Se connecter
          </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <span data-i18n="auth.divider">ou</span>
        </div>

        <!-- Register Link -->
        <p class="auth-footer">
          <span data-i18n="auth.loginPage.noAccount"
            >Pas encore de compte ?</span
          >
          <a href="register.html" class="link" data-i18n="auth.register"
            >Créer un compte</a
          >
        </p>
      </div>

      <!-- Decorative Quote -->
      <div class="auth-quote">
        <blockquote>
          <span data-i18n="auth.loginPage.quote">
            "Le yoga est un voyage vers soi-même, à travers soi-même."
          </span>
        </blockquote>
      </div>
    </div>

    <!-- Footer will be loaded dynamically -->
    <!-- <script src="js/footer-loader.js"></script> -->
    <script src="js/i18n-manager.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script>
      // Handle login form submission
      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const submitBtn = document.getElementById("submit-btn");
          const errorMessage = document.getElementById("error-message");

          // Get form data
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const remember = document.getElementById("remember").checked;

          const t = (key, fallback) => {
            if (window.i18n && typeof i18n.getTranslation === "function") {
              return i18n.getTranslation(key) || fallback;
            }
            return fallback;
          };

          // Loading state
          submitBtn.disabled = true;
          submitBtn.textContent = t("auth.loginPage.loading", "Connexion...");
          errorMessage.classList.add("hidden");

          try {
            await login(email, password, remember);

            // Success - redirect to dashboard
            window.location.href = "dashboard.html";
          } catch (error) {
            // Show error
            errorMessage.textContent = error.message;
            errorMessage.classList.remove("hidden");

            // Reset button
            submitBtn.disabled = false;
            submitBtn.textContent = t("auth.login", "Se connecter");
          }
        });
    </script>
  </body>
</html>
