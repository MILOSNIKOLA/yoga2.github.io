<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Player de séance - Yoga App" />
    <title>Séance - Yoga App</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/player.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <!-- PREMIUM 2026 DESIGN SYSTEM -->
    <link rel="stylesheet" href="css/premium-design-system.css" />
    <link rel="stylesheet" href="css/animations-premium.css" />
    <link rel="stylesheet" href="css/layout-premium.css" />
    <link rel="stylesheet" href="css/mobile-premium.css" />
    <link rel="stylesheet" href="css/session-player-premium.css" />
    <link rel="icon" href="favicon-48x481.png" type="image/x-icon" />
    <script defer src="js/dashboard-navbar-loader.js"></script>
  </head>
  <body>
    <!-- Player Container -->
    <div id="session-container">
      <div id="background"></div>
      <div id="overlay">
        <div class="player-container">
          <div class="container">
            <!-- Back Link -->
            <a href="index.html" class="back-link">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
              <span data-i18n="common.back">Retour</span>
            </a>

            <!-- Session Info -->
            <div class="session-info" id="session-info">
              <h1
                class="session-title"
                id="player-session-title"
                data-i18n="player.loading"
              >
                Chargement...
              </h1>
              <div class="session-meta">
                <span class="session-level" id="player-session-level"></span>
                <span
                  class="session-duration"
                  id="player-session-duration"
                ></span>
              </div>
            </div>

            <!-- Timer Circle -->
            <div class="timer-container">
              <svg class="timer-circle" viewBox="0 0 200 200">
                <circle
                  class="timer-bg"
                  cx="100"
                  cy="100"
                  r="85"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="8"
                  opacity="0.2"
                />
                <circle
                  id="timer-progress"
                  class="timer-progress"
                  cx="100"
                  cy="100"
                  r="85"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="8"
                  stroke-dasharray="534"
                  stroke-dashoffset="534"
                  transform="rotate(-90 100 100)"
                />
              </svg>

              <div class="timer-content">
                <div
                  class="pose-name pose-title"
                  id="pose-name"
                  data-i18n="player.ready"
                >
                  Prêt à commencer
                </div>
                <div class="time-display" id="timer">0:00</div>
                <div class="pose-number" id="pose-number"></div>
              </div>
            </div>

            <!-- Pose Instructions -->
            <div class="pose-instructions" id="pose-instructions">
              <p data-i18n="player.prepare">Préparez-vous pour votre séance</p>
            </div>

            <!-- Player Controls -->
            <div class="player-controls">
              <button id="start-btn" class="btn btn-primary btn-large">
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                >
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <span data-i18n="player.start">Commencer</span>
              </button>

              <button id="pause-btn" class="btn btn-outline btn-large hidden">
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                >
                  <rect x="6" y="4" width="4" height="16"></rect>
                  <rect x="14" y="4" width="4" height="16"></rect>
                </svg>
                <span data-i18n="player.pause">Pause</span>
              </button>

              <button id="resume-btn" class="btn btn-primary btn-large hidden">
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                >
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <span data-i18n="player.resume">Reprendre</span>
              </button>

              <button id="stop-btn" class="btn btn-text hidden">
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                >
                  <rect x="5" y="5" width="14" height="14"></rect>
                </svg>
                <span data-i18n="player.stop">Arrêter</span>
              </button>
            </div>

            <!-- Audio Control -->
            <div class="audio-control">
              <label class="option-toggle">
                <input type="checkbox" id="audio-toggle" checked />
                <span data-i18n="player.audioTransition"
                  >Son de transition</span
                >
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Completion Modal -->
    <div id="completion-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-icon">🎉</div>
        <h2>Séance terminée !</h2>
        <p>Félicitations pour ce moment que vous vous êtes accordé.</p>
        <div class="modal-stats">
          <div class="modal-stat">
            <div class="modal-stat-value" id="modal-duration">0 min</div>
            <div class="modal-stat-label">Durée</div>
          </div>
          <div class="modal-stat">
            <div class="modal-stat-value" id="modal-poses">0</div>
            <div class="modal-stat-label">Postures</div>
          </div>
        </div>
        <div class="modal-actions">
          <a href="index.html" class="btn btn-primary">Retour à l'accueil</a>
          <a href="sessions.html" class="btn btn-outline">Autres séances</a>
        </div>
      </div>
    </div>

    <script src="js/auth-ui.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script defer src="js/i18n-manager.js"></script>
    <script defer src="js/player.js"></script>
    <script>
      function updatePlayerAuth() {
        const userId =
          sessionStorage.getItem("userId") || localStorage.getItem("userId");
        const logoutBtn = document.getElementById("logout-btn");
        if (logoutBtn) {
          if (userId) {
            logoutBtn.classList.remove("hidden");
            logoutBtn.addEventListener("click", () => {
              logout();
            });
          } else {
            logoutBtn.classList.add("hidden");
          }
        }
      }
      document.addEventListener("DOMContentLoaded", updatePlayerAuth);
    </script>
    <!-- PREMIUM ANIMATIONS & SCROLL SYSTEM -->
    <script defer src="js/premium-animations.js"></script>
    <script defer src="js/scroll-animations.js"></script>
  </body>
</html>
