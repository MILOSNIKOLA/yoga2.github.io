<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content=""
      data-i18n-attr-content="energy.pageDescription"
    />
    <title data-i18n="energy.pageTitle">Énergie — Yoga App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/energie.css" />
  </head>
  <body>
    <main class="section-details-page section-article-page energy-page">
      <div class="container">
        <a
          href="index.html"
          class="btn btn-secondary page-back-link"
          data-i18n="common.back"
          >Retour</a
        >
        <header class="section-hero">
          <span class="section-kicker" data-i18n="energy.eyebrow"
            >Bénéfice du yoga</span
          >
          <h1
            class="section-title section-details-title"
            data-i18n="energy.heading"
          >
            Retrouver une énergie durable
          </h1>
          <p class="section-details-subtitle" data-i18n="energy.intro"></p>
        </header>
        <section
          class="yoga-benefits"
          aria-label=""
          data-i18n-attr-aria-label="energy.heading"
        >
          <article class="benefit-item">
            <img
              src="img/energie/energie1.jpg"
              alt=""
              class="foundation-card-img"
              loading="lazy"
            />
            <h2 data-i18n="energy.section1Title">
              Mettre le corps en mouvement
            </h2>
            <p data-i18n="energy.section1Text"></p>
          </article>
          <article class="benefit-item">
            <h2 data-i18n="energy.section2Title">Trouver le bon rythme</h2>
            <p data-i18n="energy.section2Text"></p>
          </article>
          <article class="benefit-item">
            <h2 data-i18n="energy.section3Title">Préserver son élan</h2>
            <p data-i18n="energy.section3Text"></p>
          </article>
        </section>
      </div>
    </main>

    <script defer src="js/theme.js"></script>
    <script defer src="js/i18n-manager.js"></script>
    <script defer src="js/dashboard-navbar-loader.js"></script>
  </body>
</html>
