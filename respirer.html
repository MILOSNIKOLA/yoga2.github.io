<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Exercices de respiration guidée - Yoga App"
      data-i18n-attr-content="breathing.metaDescription"
    />
    <link rel="canonical" href="https://yoga2.app/respirer.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Respiration guidée - Yoga App" />
    <meta
      property="og:description"
      content="Pratiquez des exercices de respiration guidée pour relâcher le stress et retrouver le calme."
    />
    <title data-i18n="breathing.pageTitle">Respiration - Yoga App</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/respiration.css" />
    <!-- PREMIUM 2026 DESIGN SYSTEM -->
    <link rel="stylesheet" href="css/premium-design-system.css" />
    <link rel="stylesheet" href="css/animations-premium.css" />
    <link rel="stylesheet" href="css/layout-premium.css" />
    <link rel="stylesheet" href="css/mobile-premium.css" />
    <link rel="icon" href="favicon-48x481.png" type="image/x-icon" />
  </head>
  <body>
    <!-- Language Toggle Button -->
    <button
      id="language-toggle"
      class="language-toggle"
      data-i18n-aria-label="common.aria.language"
      aria-label="Changer de langue"
    >
      <svg
        class="flag-icon"
        data-lang="fr"
        width="32"
        height="24"
        viewBox="0 0 32 24"
        aria-hidden="true"
      >
        <rect width="10.67" height="24" fill="#002395" />
        <rect x="10.67" width="10.67" height="24" fill="#FFFFFF" />
        <rect x="21.33" width="10.67" height="24" fill="#ED2939" />
      </svg>
    </button>

    <!-- Theme Toggle Button -->
    <button
      id="theme-toggle"
      class="theme-toggle"
      data-i18n-aria-label="common.aria.theme"
      aria-label="Changer le thème"
    >
      <svg
        class="sun-icon"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg
        class="moon-icon hidden"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <!-- Logout Button -->
    <button
      id="logout-btn"
      class="btn-logout hidden"
      data-i18n-aria-label="common.aria.logout"
      aria-label="Déconnexion"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>

    <!-- Back Link -->
    <div class="container" style="padding-top: 40px">
      <a href="index.html" class="back-link">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
        >
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        <span data-i18n="common.back">Retour</span>
      </a>
    </div>

    <!-- Breathing Section -->
    <section class="breathing-container">
      <div class="container">
        <h1 class="breathing-title" data-i18n="breathing.title">
          Respiration guidée
        </h1>
        <p class="breathing-subtitle" data-i18n="breathing.subtitle">
          Prenez quelques instants pour respirer
        </p>

        <!-- Breathing Type Selector -->
        <div class="breathing-selector">
          <button class="breath-type-btn active" data-type="coherence">
            <div class="breath-type-icon">❤️</div>
            <div
              class="breath-type-name"
              data-i18n="breathing.types.coherence.title"
            >
              Cohérence cardiaque
            </div>
            <div
              class="breath-type-desc"
              data-i18n="breathing.types.coherence.desc"
            >
              5s inspire / 5s expire
            </div>
          </button>

          <button class="breath-type-btn" data-type="box">
            <div class="breath-type-icon">📦</div>
            <div class="breath-type-name" data-i18n="breathing.types.box.title">
              Box Breathing
            </div>
            <div class="breath-type-desc" data-i18n="breathing.types.box.desc">
              4s chaque phase
            </div>
          </button>

          <button class="breath-type-btn" data-type="478">
            <div class="breath-type-icon">😌</div>
            <div class="breath-type-name" data-i18n="breathing.types.478.title">
              4-7-8
            </div>
            <div class="breath-type-desc" data-i18n="breathing.types.478.desc">
              Relaxation profonde
            </div>
          </button>

          <button class="breath-type-btn" data-type="energize">
            <div class="breath-type-icon">⚡</div>
            <div
              class="breath-type-name"
              data-i18n="breathing.types.energize.title"
            >
              Énergisant
            </div>
            <div
              class="breath-type-desc"
              data-i18n="breathing.types.energize.desc"
            >
              3s inspire / 6s expire
            </div>
          </button>
        </div>

        <!-- Breathing Circle -->
        <div class="breathing-circle-container">
          <svg class="breathing-circle" viewBox="0 0 200 200">
            <circle
              class="circle-bg"
              cx="100"
              cy="100"
              r="90"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              opacity="0.2"
            />
            <circle
              class="circle-main"
              cx="100"
              cy="100"
              r="70"
              fill="var(--accent-light)"
              opacity="0.3"
            />
          </svg>

          <div class="breathing-instruction">
            <div
              class="instruction-text"
              id="instruction-text"
              data-i18n="breathing.instruction.ready"
            >
              Prêt
            </div>
            <div class="instruction-count" id="instruction-count"></div>
          </div>
        </div>

        <!-- Controls -->
        <div class="breathing-controls">
          <button
            id="start-breath-btn"
            class="btn btn-primary btn-large"
            data-i18n="breathing.actions.start"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            Commencer
          </button>

          <button
            id="stop-breath-btn"
            class="btn btn-outline btn-large hidden"
            data-i18n="breathing.actions.stop"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
            Arrêter
          </button>
        </div>

        <!-- Options -->
        <div class="breathing-options">
          <label class="option-toggle">
            <input type="checkbox" id="sound-toggle" checked />
            <span data-i18n="breathing.options.sound">Son activé</span>
          </label>

          <label class="option-toggle">
            <input type="checkbox" id="vibration-toggle" />
            <span data-i18n="breathing.options.vibration">Vibrations</span>
          </label>
        </div>

        <!-- Stats -->
        <div class="breathing-stats">
          <div class="stat-item">
            <div class="stat-label" data-i18n="breathing.stats.cycles">
              Cycles complétés
            </div>
            <div class="stat-value" id="cycles-count">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label" data-i18n="breathing.stats.totalTime">
              Temps total
            </div>
            <div class="stat-value" id="total-time">0:00</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer will be loaded dynamically -->
    <!-- (Footer populated by footer-loader.js) -->

    <script defer src="js/auth-ui.js"></script>
    <script defer src="js/i18n-manager.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/footer-loader.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/breathing.js"></script>
    <!-- PREMIUM ANIMATIONS & SCROLL SYSTEM -->
    <script defer src="js/premium-animations.js"></script>
    <script defer src="js/scroll-animations.js"></script>
  </body>
</html>
